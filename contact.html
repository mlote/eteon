<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Contact - MicFi</title>
  <meta name="description" content="Tell us what you need and we'll reply. Reach MicFi by form, WhatsApp, phone, or email.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="MicFi">
  <meta property="og:title" content="Contact - MicFi">
  <meta property="og:description" content="Tell us what you need and we'll reply.">
  <meta property="og:url" content="https://micfi.net/contact.html">
  <meta property="og:locale" content="en_US">
  <meta name="theme-color" content="#F7F7F8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="assets/fonts/nunito-sans-latin.woff2">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <script>
    try {
      var t = localStorage.getItem("micfi-theme");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
</head>
<body class="page-contact">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">
        <img class="brand-logo" src="assets/mark.png" alt="MicFi" width="32" height="32">
      </a>
      <nav class="nav-inline" aria-label="Primary" data-nav="header"></nav>
      <div class="header-actions">
        <button class="icon-btn theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch to dark theme">
          <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        </button>
        <button class="icon-btn menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="site-menu">
          <svg class="menu-icon menu-icon-menu" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          <svg class="menu-icon menu-icon-close" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
    </div>
    <nav class="nav-panel" id="site-menu" aria-label="Menu" data-nav="panel"></nav>
  </header>

  <main id="main">
    <!-- #region Contact -->
    <section class="page-intro container">
      <h1 class="page-title">Contact</h1>
      <p class="page-sub">Tell us what you need and we'll reply.</p>
    </section>
<!-- #endregion -->

    <!-- #region Send an inquiry -->
    <section class="section container">
      <h2 class="sr-only">Send an inquiry</h2>
      <form class="form-card" data-contact-form novalidate>
        <div class="field">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" autocomplete="name" placeholder="Your name" required aria-required="true" aria-describedby="name-error">
          <p class="field-error" id="name-error" hidden></p>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@business.com" required aria-required="true" aria-describedby="email-error">
          <p class="field-error" id="email-error" hidden></p>
        </div>
        <div class="field">
          <label for="need">What do you need?</label>
          <select id="need" name="need">
            <option value="Website">Website</option>
            <option value="Web app">Web app</option>
            <option value="Desktop app">Desktop app</option>
            <option value="Management system">Management system</option>
            <option value="Custom solution">Custom solution</option>
            <option value="Not sure">Not sure</option>
          </select>
        </div>
        <div class="field">
          <label for="message">Message (optional)</label>
          <textarea id="message" name="message" rows="4" placeholder="Tell us a bit about your project"></textarea>
        </div>
        <div class="form-actions">
          <button class="btn btn-primary" type="submit" data-channel="whatsapp"><span data-icon="whatsapp" data-icon-size="18"></span>Send via WhatsApp</button>
          <button class="btn btn-ghost" type="submit" data-channel="email"><span data-icon="mail" data-icon-size="18"></span>Send via email</button>
        </div>
        <p class="small muted form-note" data-form-note hidden></p>
      </form>
    </section>
<!-- #endregion -->

    <!-- #region Direct options -->
    <section class="section container">
      <h2 class="sr-only">Prefer to call?</h2>
      <ul class="contact-icons">
        <li>
          <a class="contact-icon contact-icon-call" href="tel:+256762451545" data-tel-link aria-label="Call MicFi">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          </a>
        </li>
      </ul>
    </section>
<!-- #endregion -->
  </main>

  <footer class="site-footer">
    <a class="footer-brand" href="index.html">
      <img class="footer-logo" src="assets/logo-light.png" alt="MicFi" width="49" height="56">
    </a>
    <nav class="footer-links" aria-label="Footer" data-nav="footer"></nav>
    <div class="social-row" data-social-row></div>
    <p class="footer-address muted small">Kansanga, Kampala, Uganda</p>
    <p class="footer-copy">&copy; <span data-year>2026</span> MicFi. All rights reserved.</p>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/services.js"></script>
  <script src="js/projects.js"></script>
  <script src="js/contact.js"></script>
  <script src="js/reveal.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
